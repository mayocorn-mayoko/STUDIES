<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書き出し設定 | STUDIES</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/export.css">
</head>
<body>

<nav class="topnav">
  <a class="topnav__brand" href="index.html">STUDI<span>E</span>S</a>
  <div class="topnav__links">
    <a href="index.html">ホーム</a>
    <a href="goal.html">目標設定</a>
    <a href="timer.html">タイマー</a>
    <a href="guide.html">使い方</a>
  </div>
</nav>

<main class="page">

  <section class="section">
    <h2 class="section__title">書き出す範囲を設定</h2>
    <p class="empty-state" style="border:none; padding-left:0;">
      書き出す日付の範囲と、含める項目を選んでJSONファイルとしてダウンロードします。
    </p>

    <form id="export-form">

      <div class="field">
        <label>日付の範囲（空欄の場合は制限なし）</label>
        <div class="field-row">
          <div class="field">
            <label for="export-start-date">開始日</label>
            <input type="date" id="export-start-date">
          </div>
          <div class="field">
            <label for="export-end-date">終了日</label>
            <input type="date" id="export-end-date">
          </div>
        </div>
      </div>

      <div class="field">
        <label>含める項目</label>
        <div class="checkbox-list">
          <label class="checkbox-list__item">
            <input type="checkbox" id="include-goals" checked>
            <span>目標</span>
          </label>
          <label class="checkbox-list__item">
            <input type="checkbox" id="include-schedule" checked>
            <span>勉強予定 (To-Do)</span>
          </label>
          <label class="checkbox-list__item">
            <input type="checkbox" id="include-records" checked>
            <span>勉強履歴</span>
          </label>
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn--primary">この内容で書き出す</button>
      </div>
    </form>
  </section>

  <section class="section" style="border-bottom:none;">
    <a class="btn" href="index.html">ホームに戻る</a>
  </section>

</main>

<script src="js/common.js"></script>
<script src="js/export.js"></script>
</body>
</html>
